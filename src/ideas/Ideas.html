  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ransform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px}\n  header h1{font-size:38px;font-weight:600;letter-spacing:-.01em}\n  header p{color:#A8A49B;font-size:15px;margin-top:10px;max-width:560px;\n    margin-inline:auto;line-height:1.5;text-wrap:pretty}\n\n  .grid{display:flex;flex-direction:column;gap:26px}\n  .card{background:#FBFAF6;border-radius:24px;padding:14px;\n    box-shadow:0 20px 50px -16px rgba(0,0,0,.6),inset 0 0 0 1.5px rgba(255,255,255,.04)}\n  .screen{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:21/8;\n    background:#0c0b0a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}\n  .screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}\n  .badge{position:absolute;top:12px;left:12px;z-index:2;display:flex;align-items:center;gap:8px;\n    background:rgba(12,11,10,.42);backdrop-filter:blur(6px);border-radius:999px;\n    padding:7px 13px 7px 9px;color:#fff;\n    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}\n  .badge .no{font-family:var(--font-mono);font-weight:700;font-size:11px;\n    width:22px;height:22px;border-radius:50%;display:grid;place-items:center;\n    background:rgba(255,255,255,.16)}\n  .badge b{font-weight:600;font-size:15px;letter-spacing:-.01em}\n\n  .meta{display:flex;align-items:center;justify-content:space-between;\n    padding:12px 8px 4px;gap:14px}\n  .meta .left{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}\n  .meta .name{font-weight:600;font-size:17px}\n  .meta .tag{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);\n    letter-spacing:.04em}\n  .swatches{display:flex;gap:6px;flex:none}\n  .swatches i{width:20px;height:20px;border-radius:6px;display:block;\n    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}\n\n  .note{margin-top:42px;text-align:center;color:#8C887E;font-family:var(--font-mono);\n    font-size:12px;letter-spacing:.04em;line-height:1.7}\n  .note b{color:var(--accent)}\n\n  .section-head{margin:64px 0 22px;color:#F1F0EA}\n  .section-head .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.28em;\n    text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px}\n  .section-head h2{font-size:26px;font-weight:600;letter-spacing:-.01em}\n  .section-head p{color:#A8A49B;font-size:14px;margin-top:8px;max-width:580px;line-height:1.5;text-wrap:pretty}\n  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}\n  .grid2 .screen{aspect-ratio:16/7}\n  @media(max-width:720px){.grid2{grid-template-columns:1fr}}\n  .swatch1{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}\n  .swatch1 i{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n  <div class=\"wrap\">\n    <header>\n      <div class=\"eyebrow\">Line Runner · Level art<\u002Fdiv>\n      <h1>Three ways to break the sameness<\u002Fh1>\n      <p>Three independent dials you can mix per level: the <b style=\"color:#F1F0EA\">grounds type<\u002Fb> the fox physically traverses, the <b style=\"color:#F1F0EA\">grounds style<\u002Fb> it's surfaced with, and the <b style=\"color:#F1F0EA\">background style<\u002Fb> behind it.<\u002Fp>\n    <\u002Fheader>\n\n    <div class=\"section-head\">\n      <div class=\"eyebrow\">A · Grounds type<\u002Fdiv>\n      <h2>Physical shape of the ground<\u002Fh2>\n      <p>The platformer dial — the floor gets real geometry. The fox runs the slopes, climbs steps, hops gaps and jumps onto ledges under live physics. Each loops seamlessly.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"grid2\" id=\"grid-terrain\"><\u002Fdiv>\n\n    <div class=\"section-head\">\n      <div class=\"eyebrow\">B · Grounds style<\u002Fdiv>\n      <h2>What the ground is made of<\u002Fh2>\n      <p>The surface material of the crust — the run line stays flat here, only the texture changes. Eight surfaces, each scrolling at full speed under the fox.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"grid2\" id=\"grid-surfaces\"><\u002Fdiv>\n\n    <div class=\"section-head\">\n      <div class=\"eyebrow\">C · Background style<\u002Fdiv>\n      <h2>Sky &amp; backdrop<\u002Fh2>\n      <p>Gradient sky, two parallax silhouette layers, ambient particles. Pure backdrop — it never touches gameplay.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"grid\" id=\"grid\"><\u002Fdiv>\n\n    <div class=\"note\">\n      Mix any grounds type with any style and background — pure data, drop straight into the engine.<br>\n      Want me to wire your picks into the real levels, add more, or push one further? Just say which.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <script src=\"3c735071-e1c2-48ef-95bf-cfd653eaebc2\"><\u002Fscript>\n  <script src=\"0a1c3f7c-a34c-498d-9710-b9351b88fa2b\"><\u002Fscript>\n  <script src=\"60dd91c2-d663-4480-b478-2aa950de202f\"><\u002Fscript>\n  <script src=\"858d011d-6187-494e-958e-5ba4ca9c8e74\"><\u002Fscript>\n  <script>\n    const grid = document.getElementById('grid');\n    window.GROUNDS.forEach((cfg, i) => {\n      const card = document.createElement('div');\n      card.className = 'card';\n      card.innerHTML = `\n        <div class=\"screen\">\n          <canvas><\u002Fcanvas>\n          <div class=\"badge\"><span class=\"no\">${String(i+1).padStart(2,'0')}<\u002Fspan><b>${cfg.name}<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"left\">\n            <span class=\"name\">${cfg.name}<\u002Fspan>\n            <span class=\"tag\">${cfg.tag}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"swatches\">\n            <i style=\"background:${cfg.sky[0][1]}\"><\u002Fi>\n            <i style=\"background:${cfg.sky[cfg.sky.length-1][1]}\"><\u002Fi>\n            <i style=\"background:${cfg.ground}\"><\u002Fi>\n            <i style=\"background:${cfg.accent}\"><\u002Fi>\n          <\u002Fdiv>\n        <\u002Fdiv>`;\n      grid.appendChild(card);\n    });\n    // construct once, after a paint so layout is settled\n    function initStrips(){\n      grid.querySelectorAll('.card').forEach((card, i) => {\n        const cv = card.querySelector('canvas');\n        try { new window.GroundStrip(cv, window.GROUNDS[i]); }\n        catch (e) { console.error('strip ' + i + ' failed:', e); }\n      });\n    }\n\n    // ----- ground surfaces -----\n    const gridS = document.getElementById('grid-surfaces');\n    window.GROUND_TYPES.forEach((cfg, i) => {\n      const card = document.createElement('div');\n      card.className = 'card';\n      card.innerHTML = `\n        <div class=\"screen\">\n          <canvas><\u002Fcanvas>\n          <div class=\"badge\"><span class=\"no\">${String.fromCharCode(65+i)}<\u002Fspan><b>${cfg.name}<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"left\">\n            <span class=\"name\">${cfg.name}<\u002Fspan>\n            <span class=\"tag\">${cfg.tag}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"swatch1\"><i style=\"background:${cfg.accent}\"><\u002Fi>${cfg.accent}<\u002Fdiv>\n        <\u002Fdiv>`;\n      gridS.appendChild(card);\n    });\n    function initSurfaces(){\n      gridS.querySelectorAll('.card').forEach((card, i) => {\n        const cv = card.querySelector('canvas');\n        try { new window.GroundTypeStrip(cv, window.GROUND_TYPES[i]); }\n        catch (e) { console.error('surface ' + i + ' failed:', e); }\n      });\n    }\n\n    // ----- terrain shapes -----\n    const gridT = document.getElementById('grid-terrain');\n    window.TERRAINS.forEach((cfg, i) => {\n      const card = document.createElement('div');\n      card.className = 'card';\n      card.innerHTML = `\n        <div class=\"screen\">\n          <canvas><\u002Fcanvas>\n          <div class=\"badge\"><span class=\"no\">${i+1}<\u002Fspan><b>${cfg.name}<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"left\">\n            <span class=\"name\">${cfg.name}<\u002Fspan>\n            <span class=\"tag\">${cfg.tag}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"swatch1\"><i style=\"background:${cfg.accent}\"><\u002Fi>physics<\u002Fdiv>\n        <\u002Fdiv>`;\n      gridT.appendChild(card);\n    });\n    function initTerrain(){\n      gridT.querySelectorAll('.card').forEach((card, i) => {\n        const cv = card.querySelector('canvas');\n        try { new window.TerrainStrip(cv, window.TERRAINS[i]); }\n        catch (e) { console.error('terrain ' + i + ' failed:', e); }\n      });\n    }\n    window.addEventListener('load', () => setTimeout(() => { initStrips(); initSurfaces(); initTerrain(); }, 0));\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
